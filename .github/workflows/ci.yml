name: CI

# Alur Pertemuan 11:
#   test (analyze + unit test app & server) --hijau--> build-apk --> deploy (pre-release APK "Live" untuk tester)
# Jika satu unit test gagal, job build-apk dan deploy otomatis di-skip.

on:
  push:
    branches: [main, v1.0, v1.0_dev, v1.1]
  pull_request:
    branches: [main, v1.0, v1.1]
  workflow_dispatch:
    inputs:
      demo_fail:
        description: 'Demo P11: paksa satu unit test gagal untuk melihat efeknya'
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  test:
    name: Analyze & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies (app)
        run: flutter pub get

      # Folder server/ adalah paket terpisah dan dianalisis di langkah "Analyze (server)".
      - name: Analyze (app)
        run: flutter analyze lib test

      - name: Unit test (app)
        run: flutter test --reporter expanded --dart-define=DEMO_FAIL=${{ github.event.inputs.demo_fail == 'true' }}

      - name: Install dependencies (server)
        working-directory: server
        run: dart pub get

      - name: Analyze (server)
        working-directory: server
        run: dart analyze

      - name: Unit test (server)
        working-directory: server
        run: dart test --reporter expanded

  build-apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Tanpa android/key.properties, build.gradle.kts memakai kunci debug (cukup untuk APK uji coba).
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sodiscan-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256

  deploy:
    name: Deploy (pre-release untuk testing)
    needs: build-apk
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sodiscan-${{ github.ref_name }}-${{ github.run_number }}
          path: dist

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-build-${{ github.run_number }}
          name: SodiScan ${{ github.ref_name }} build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Build otomatis dari branch `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Semua unit test lulus. APK siap diunduh untuk testing.
          files: |
            dist/app-release.apk
            dist/app-release.apk.sha256
